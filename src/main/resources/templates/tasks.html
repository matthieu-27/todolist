<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
  <title>TodoList</title>
  <style>
    .guest-preview { filter: blur(3px); pointer-events: none; user-select: none; opacity: 0.55; }
  </style>
</head>
<body>
<div layout:fragment="content">

  <!-- ========== GUEST VIEW ========== -->
  <div th:unless="${isAuthenticated}">

    <!-- Hero -->
    <div class="text-center py-5 my-3">
      <h1 class="display-4 fw-bold mb-3">Organisez votre quotidien</h1>
      <p class="lead text-muted mb-4">Gérez vos tâches, suivez vos projets, accomplissez plus.</p>
      <a th:href="@{/login}" class="btn btn-dark btn-lg px-5">Commencer</a>
    </div>



    <!-- Blurred demo preview with overlay CTA -->
    <div class="position-relative mb-5">
      <div class="row row-cols-3 gy-2 guest-preview">
        <div class="col"><div class="card"><div class="card-body fw-bold">TODO</div></div></div>
        <div class="col"><div class="card"><div class="card-body fw-bold">DOING</div></div></div>
        <div class="col"><div class="card"><div class="card-body fw-bold">Done</div></div></div>
        <div class="col" th:each="t : ${todo}">
          <div class="card mb-3">
            <div class="card-header" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
            <div class="card-body">
              <h5 class="card-title" th:text="${t.title}"></h5>
              <p class="card-text small" th:text="${t.description}"></p>
            </div>
          </div>
        </div>
        <div class="col" th:each="t : ${doing}">
          <div class="card mb-3">
            <div class="card-header" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
            <div class="card-body">
              <h5 class="card-title" th:text="${t.title}"></h5>
              <p class="card-text small" th:text="${t.description}"></p>
            </div>
          </div>
        </div>
        <div class="col" th:each="t : ${done}">
          <div class="card mb-3">
            <div class="card-header" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
            <div class="card-body">
              <h5 class="card-title" th:text="${t.title}"></h5>
              <p class="card-text small" th:text="${t.description}"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="position-absolute top-50 start-50 translate-middle text-center">
        <div class="bg-white border rounded-3 shadow p-4">
          <p class="mb-3 fw-semibold">Vos tâches vous attendent</p>
          <a th:href="@{/login}" class="btn btn-dark px-4">Se connecter</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== USER VIEW ========== -->
  <div th:if="${isAuthenticated}">

    <!-- Modals -->
    <div class="modal fade" id="modalCreateTask" aria-hidden="true" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Nouvelle tâche</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/create-task}" th:object="${task}" method="post">
              <div class="form-group mb-3">
                <label for="title" class="form-label">Titre</label>
                <input id="title" type="text" th:field="*{title}" class="form-control" required/>
              </div>
              <div class="form-group mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
              </div>
              <div class="form-group mb-3">
                <label for="status" class="form-label">Statut</label>
                <select id="status" name="status" class="form-select">
                  <option th:each="s : ${status}" th:text="${s}" th:value="${s}" th:selected="${task.status == s}"/>
                </select>
              </div>
              <div class="form-group mb-3">
                <label for="scheduledAt" class="form-label">Date prévue</label>
                <input type="date" class="form-control" id="scheduledAt" th:field="*{scheduledAt}"/>
              </div>
              <div class="form-group mb-3">
                <label for="category" class="form-label">Catégorie</label>
                <select id="category" name="categoryId" class="form-select">
                  <option value="">Aucune catégorie</option>
                  <option th:each="cat : ${categories}" th:text="${cat.name}" th:value="${cat.id}"/>
                </select>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">Sauvegarder</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalCreateCategory" aria-hidden="true" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Nouvelle catégorie</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/save-category}" th:object="${category}" method="post">
              <div class="form-group mb-3">
                <label for="name" class="form-label">Nom</label>
                <input id="name" type="text" th:field="*{name}" class="form-control" required/>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">Sauvegarder</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Mes Tâches</h2>
      <div class="d-flex gap-2">
        <a th:href="${weeklyView} ? @{/home} : @{/home(weeklyView=true)}" class="btn btn-outline-secondary">
          <span th:text="${weeklyView} ? 'Vue normale' : 'Vue semaine'"></span>
        </a>
        <button class="btn btn-outline-dark" data-bs-target="#modalCreateCategory" data-bs-toggle="modal">
          + Catégorie
        </button>
        <button class="btn btn-dark" data-bs-target="#modalCreateTask" data-bs-toggle="modal">
          + Tâche
        </button>
      </div>
    </div>

    <!-- Weekly view -->
    <div th:if="${weeklyView}">
      <div th:each="entry : ${tasksByWeek}" class="mb-4">
        <h5 class="text-muted mb-2" th:text="${entry.key}"></h5>
        <div class="row row-cols-1 row-cols-md-3 g-3">
          <div th:each="task : ${entry.value}" class="col">
            <div class="card h-100">
              <div class="card-header" th:text="${task.category != null} ? ${task.category.name} : 'Sans catégorie'"></div>
              <div class="card-body">
                <h5 class="card-title" th:text="${task.title}"></h5>
                <p class="card-text small" th:text="${task.description}"></p>
              </div>
              <div class="card-footer d-flex justify-content-between align-items-center">
                <small class="text-muted" th:text="${#dates.format(task.scheduledAt, 'dd/MM/yyyy')}" th:if="${task.scheduledAt}"></small>
                <div class="d-flex gap-1">
                  <a th:href="@{/edit-task/{id}(id=${task.id})}" class="btn btn-outline-secondary btn-sm">Modifier</a>
                  <a th:href="@{/delete-task/{id}(id=${task.id})}" class="btn btn-outline-danger btn-sm">Supprimer</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Normal view -->
    <div th:unless="${weeklyView}">
      <div class="row g-3">
        <div class="col-4">
          <div class="card bg-light mb-2"><div class="card-body fw-bold">TODO</div></div>
          <div th:each="t : ${todo}">
            <div class="card mb-2">
              <div class="card-header small" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
              <div class="card-body">
                <h5 class="card-title" th:text="${t.title}"></h5>
                <p class="card-text small" th:text="${t.description}"></p>
                <div class="d-flex gap-1">
                  <a th:href="@{/edit-task/{id}(id=${t.id})}" class="btn btn-outline-secondary btn-sm">Modifier</a>
                  <a th:href="@{/delete-task/{id}(id=${t.id})}" class="btn btn-outline-danger btn-sm">Supprimer</a>
                </div>
              </div>
              <div class="card-footer" th:if="${t.scheduledAt}">
                <small class="text-muted" th:text="${#dates.format(t.scheduledAt, 'dd/MM/yyyy')}"></small>
              </div>
            </div>
          </div>
        </div>

        <div class="col-4">
          <div class="card bg-light mb-2"><div class="card-body fw-bold">DOING</div></div>
          <div th:each="t : ${doing}">
            <div class="card mb-2">
              <div class="card-header small" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
              <div class="card-body">
                <h5 class="card-title" th:text="${t.title}"></h5>
                <p class="card-text small" th:text="${t.description}"></p>
                <div class="d-flex gap-1">
                  <a th:href="@{/edit-task/{id}(id=${t.id})}" class="btn btn-outline-secondary btn-sm">Modifier</a>
                  <a th:href="@{/delete-task/{id}(id=${t.id})}" class="btn btn-outline-danger btn-sm">Supprimer</a>
                </div>
              </div>
              <div class="card-footer" th:if="${t.scheduledAt}">
                <small class="text-muted" th:text="${#dates.format(t.scheduledAt, 'dd/MM/yyyy')}"></small>
              </div>
            </div>
          </div>
        </div>

        <div class="col-4">
          <div class="card bg-light mb-2"><div class="card-body fw-bold">Done</div></div>
          <div th:each="t : ${done}">
            <div class="card mb-2">
              <div class="card-header small" th:text="${t.category != null} ? ${t.category.name} : 'Sans catégorie'"></div>
              <div class="card-body">
                <h5 class="card-title" th:text="${t.title}"></h5>
                <p class="card-text small" th:text="${t.description}"></p>
                <div class="d-flex gap-1">
                  <a th:href="@{/edit-task/{id}(id=${t.id})}" class="btn btn-outline-secondary btn-sm">Modifier</a>
                  <a th:href="@{/delete-task/{id}(id=${t.id})}" class="btn btn-outline-danger btn-sm">Supprimer</a>
                </div>
              </div>
              <div class="card-footer" th:if="${t.scheduledAt}">
                <small class="text-muted" th:text="${#dates.format(t.scheduledAt, 'dd/MM/yyyy')}"></small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
